group 'io.paratoner.flutter_tesseract_ocr'
version '1.0'

// The AGP classpath used to be declared here directly (pinned to a
// long-obsolete 7.1.2, alongside the now-shut-down jcenter() repository),
// which conflicted with the app's own centrally-managed AGP version
// (declared once in android/settings.gradle.kts). Removed in favor of
// resolving `com.android.library` the same way every other Flutter plugin
// subproject in this build does, through that central pluginManagement
// block, rather than pinning a second, conflicting AGP version here.

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
        flatDir {
           dirs project(':flutter_tesseract_ocr').file('libs')
        }

    }
}

apply plugin: 'com.android.library'

android {
    namespace "io.paratoner.flutter_tesseract_ocr"
    compileSdkVersion 34
    
     
    defaultConfig {
        minSdkVersion 21
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

    }
    lintOptions {
        disable 'InvalidPackage'
    }
    // packagingOptions{
    //     doNotStrip '*/mips/*.so'
    //     doNotStrip '*/mips64/*.so'
    // }
}
// repositories {
//     flatDir {
//         dirs 'libs'
//         dirs project(':flutter_tesseract_ocr').file('libs')
//     }
// }
dependencies {
    api(name: 'tesseract4android-release', ext: 'aar')
}
